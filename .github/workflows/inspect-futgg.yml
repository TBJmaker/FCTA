name: Inspect FUTGG feeds

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Test FUTGG data
        run: |
          python - <<'PY'
          import json
          import urllib.request

          headers = {
              "User-Agent": "Mozilla/5.0",
              "Accept": "application/json"
          }

          urls = [
              "https://www.fut.gg/api/fut/players/v2/27/?page=1",
              "https://s3.eu-west-2.amazonaws.com/game-assets.fut.gg/27/cdn-data/player-prices-ps5.json"
          ]

          for url in urls:
              print("\n========================================")
              print("URL:", url)

              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read()
                      print("STATUS:", response.status)
                      print("BYTES:", len(raw))

                      try:
                          data = json.loads(raw)
                          if isinstance(data, dict):
                              print("TOP LEVEL KEYS:", list(data.keys()))
                              for key, value in data.items():
                                  if isinstance(value, list):
                                      print(key, "LIST LENGTH:", len(value))
                              print("JSON SAMPLE:")
                              print(json.dumps(data, indent=2)[:5000])
                          else:
                              print("JSON TYPE:", type(data).__name__)
                              print(str(data)[:5000])

                      except Exception as e:
                          print("NOT JSON:", e)
                          print(raw[:2000])

              except Exception as e:
                  print("REQUEST FAILED:", repr(e))
          PY
