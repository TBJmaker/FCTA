name: Build FC Trader Assistant v2.3 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'FCTraderAssistantV23/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build v2.3 APK
        run: gradle -p FCTraderAssistantV23 :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FC-Trader-Assistant-v2.3-APK
          path: FCTraderAssistantV23/app/build/outputs/apk/debug/app-debug.apk
