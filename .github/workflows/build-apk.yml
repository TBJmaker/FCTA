name: Build FC Trader Assistant v2.3

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find ONLY v2.3 project
        run: |
          SETTINGS_FILE="$(find . -type f -path "*/FCTraderAssistantV23/settings.gradle.kts" -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "FCTraderAssistantV23 was not found"
            find . -maxdepth 8 -type f -name "settings.gradle.kts" -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "V2.3 project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build v2.3 APK
        run: gradle -p "$PROJECT_DIR" :app:assembleDebug

      - name: Upload v2.3 APK
        uses: actions/upload-artifact@v4
        with:
          name: FC-Trader-Assistant-v2.3-CORRECT-APK
          path: |
            **/FCTraderAssistantV23/app/build/outputs/apk/debug/app-debug.apk
