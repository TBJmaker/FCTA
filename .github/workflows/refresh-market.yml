name: Refresh FC27 market feed

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/sync_futgg.py'
      - '.github/workflows/refresh-market.yml'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: fc27-market-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install updater dependencies
        run: pip install --disable-pip-version-check requests

      - name: Refresh FC27 card catalogue and prices
        run: python tools/sync_futgg.py

      - name: Validate feed
        run: |
          python -m json.tool data/cards.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('data/cards.json').read_text(encoding='utf-8'))
          cards = p.get('cards', [])
          if len(cards) < 1000:
              raise SystemExit(f'Refusing feed with only {len(cards)} cards')
          print(f'Validated {len(cards)} cards')
          PY

      - name: Commit fresh feed
        run: |
          if git diff --quiet -- data/cards.json; then
            echo 'No feed changes.'
            exit 0
          fi
          git config user.name 'FC Trader Market Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/cards.json
          git commit -m 'Refresh FC27 market feed'
          git push
